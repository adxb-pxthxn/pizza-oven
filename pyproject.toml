[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pizza-oven-cad"
version = "0.0.0"
description = "Parametric build123d models for an open-source portable pizza oven."
requires-python = ">=3.11,<3.15"
dependencies = [
    "build123d==0.13.0",
    "cadquery-ocp-novtk==8.0.1.1.0",
]

[project.optional-dependencies]
preview = ["ocp-vscode==4.2.0"]

[tool.setuptools.packages.find]
include = ["cad", "cad.*"]
exclude = ["cad.tests*", "cad.output*"]
