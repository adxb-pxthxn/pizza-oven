<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="980" height="560" fill="#f4f1ea"/>
  <text x="24" y="32" font-size="15" font-weight="700" fill="#1c1915">Original section — recommended first oven</text>
  <text x="24" y="52" font-size="12" fill="#5c564c">Steady-state sketch at a 500°C chamber and 20°C still air. Temperatures are model outputs, not measurements of any Gozney oven.</text>

  <!-- stand -->
  <rect x="150" y="470" width="18" height="60" fill="#8a8478"/>
  <rect x="700" y="470" width="18" height="60" fill="#8a8478"/>
  <rect x="140" y="458" width="590" height="14" fill="#c4b8a4"/>
  <text x="150" y="548" font-size="11" fill="#3d3934">Non-combustible deck, then an air gap, then the stand. Timber stays below this line.</text>

  <!-- floor stack -->
  <rect x="180" y="430" width="520" height="28" fill="#6e6a62"/>
  <rect x="192" y="400" width="496" height="30" fill="#d8c7a2"/>
  <rect x="204" y="378" width="472" height="22" fill="#e6d3a1" stroke="#8a7040"/>
  <text x="214" y="393" font-size="11" fill="#3d3424">20 mm cordierite, floating, about 4 mm clear all round</text>

  <!-- vault -->
  <path d="M180 430 L180 300 Q180 168 440 150 Q700 168 700 300 L700 430 Z" fill="#8d9294"/>
  <path d="M204 418 L204 312 Q204 196 440 178 Q676 196 676 312 L676 418 Z" fill="#c96b3c"/>
  <path d="M228 404 L228 324 Q228 224 440 208 Q652 224 652 324 L652 404 Z" fill="#b7bcc0"/>
  <!-- chamber -->
  <path d="M240 392 L240 336 Q240 248 440 236 Q640 248 640 336 L640 392 Z" fill="#2a2420"/>
  <text x="360" y="320" font-size="13" fill="#f3e6cf" font-weight="700">Chamber 500°C</text>
  <text x="330" y="340" font-size="11" fill="#e7d7c0">Flame rolls the ceiling, then the front flue</text>

  <!-- mouth -->
  <path d="M240 336 L160 336 L160 392 L240 392 Z" fill="#1a1614"/>
  <text x="40" y="368" font-size="11" fill="#1c1915">Mouth</text>
  <text x="40" y="384" font-size="11" fill="#1c1915">~140 mm</text>
  <text x="40" y="400" font-size="11" fill="#5c564c">0.63 × apex</text>

  <!-- flue -->
  <rect x="560" y="70" width="36" height="100" fill="#8d9294" stroke="#3d3934"/>
  <rect x="568" y="78" width="20" height="92" fill="#2a2420"/>
  <text x="604" y="96" font-size="11" fill="#1c1915">Front flue</text>
  <text x="604" y="112" font-size="11" fill="#5c564c">304, clear of timber</text>

  <!-- callouts -->
  <g font-size="12" fill="#1c1915">
    <line x1="676" y1="250" x2="760" y2="210" stroke="#1c1915"/>
    <text x="768" y="198">304 liner, ~1.2 mm</text>
    <text x="768" y="214" fill="#5c564c">inner face ~487°C</text>

    <line x1="652" y1="270" x2="790" y2="270" stroke="#1c1915"/>
    <text x="798" y="266">AES blanket 75 mm</text>
    <text x="798" y="282" fill="#5c564c">k = 0.10 assumed</text>

    <line x1="700" y1="340" x2="790" y2="340" stroke="#1c1915"/>
    <text x="798" y="336">Foil standoff 12 mm</text>
    <text x="798" y="352" fill="#5c564c">fibre cold face ~154°C</text>

    <line x1="700" y1="400" x2="790" y2="410" stroke="#1c1915"/>
    <text x="798" y="406">Painted steel skin</text>
    <text x="798" y="422" fill="#5c564c">~60°C at 20°C air</text>
    <text x="798" y="438" fill="#5c564c">~71°C at 35°C air</text>
  </g>

  <g font-size="12">
    <rect x="24" y="430" width="140" height="78" fill="none" stroke="#8a3b2b"/>
    <text x="32" y="450" fill="#8a3b2b" font-weight="700">Wood sleeve</text>
    <text x="32" y="468" fill="#3d3934">Only outside this</text>
    <text x="32" y="484" fill="#3d3934">steel, ventilated,</text>
    <text x="32" y="500" fill="#3d3934">and removable.</text>
  </g>

  <text x="180" y="452" font-size="11" fill="#f4f1ea">Floor blanket and steel base, same duty as the dome</text>
</svg>
