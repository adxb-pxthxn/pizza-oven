<text x="16" y="34" font-family="Georgia, serif" font-size="3.6" fill="#1c1a17">Top. Dashed circle is the 430 stone. Handles left and right.</text>
<text x="200" y="70" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Floor Ø430. Chamber Ø470. Apex 165. Mouth/apex 0.576.</text>
<text x="200" y="78" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Handle span 1165. Fits between the arches (1224) with the handles on.</text>
<text x="200" y="90" font-family="Georgia, serif" font-size="3.2" fill="#5c5348">Plan is wider than the lowered tailgate is deep (517). It stands on the ground or a table.</text>
