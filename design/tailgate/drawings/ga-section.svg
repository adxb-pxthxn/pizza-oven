<line x1="150.00" y1="150.42" x2="150.00" y2="231.33" stroke="#8a6a32" stroke-width="0.25" stroke-dasharray="2 1"/>
<text x="18" y="40" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Stack at the wall, gas outward</text>
<text x="18" y="48" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">1.2 liner · 75 AES · 25 calcium silicate · 1.2 skin</text>
<text x="18" y="56" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Skin about 53°C. A short touch, not a lean.</text>
<text x="18" y="68" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Stack at the crown</text>
<text x="18" y="76" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">1.2 liner · 100 AES · 1.2 skin. No board.</text>
<text x="18" y="84" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Skin about 55°C. Same total thickness, so one outer surface.</text>
<text x="18" y="96" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Cinch</text>
<text x="18" y="104" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Brass band 35 × 3. Joggle 12 above the mouth.</text>
<text x="18" y="112" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Two dowels lock the crown for the drive. Lift the band, lift the crown, lift the stone.</text>
<text x="18" y="124" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Floor</text>
<text x="18" y="132" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Ø430 × 20 cordierite, offset 8 mm to leave a burner crescent.</text>
<text x="18" y="140" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Under it: 25 calcium silicate, 25 AES, 1.5 pan.</text>
<text x="250" y="40" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">What a hand holds</text>
<text x="250" y="48" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Jarrah bars, 32 × 220, on 35 mm stands.</text>
<text x="250" y="56" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">The shell is not a touch surface.</text>
<text x="250" y="68" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Gas</text>
<text x="250" y="76" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">5.8 kW bought burner, FFD, LCC27 at 2.75 kPa.</text>
<text x="250" y="84" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">No jet is drawn. No wood fire.</text>
<text x="250" y="96" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Colours</text>
<text x="250" y="104" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Grey steel. Cream AES. Pale board. Tan stone. Brass band.</text>
</svg>
