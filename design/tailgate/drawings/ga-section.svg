<polygon points="150.00,177.18 202.22,187.18 202.49,187.18 150.00,176.91" fill="#8d9398" stroke="#1c1a17" stroke-width="0.2"/>
<polygon points="150.00,176.91 202.49,187.18 224.71,187.18 150.00,154.69" fill="#e6d7a8" stroke="#1c1a17" stroke-width="0.2"/>
