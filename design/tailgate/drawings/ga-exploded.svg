<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="420" height="297" fill="#f7f4ee"/>
<rect x="8" y="8" width="404" height="281" fill="none" stroke="#1c1a17" stroke-width="0.6"/>
<rect x="8" y="252" width="404" height="37" fill="none" stroke="#1c1a17" stroke-width="0.4"/>
<text x="14" y="266" font-family="Georgia, serif" font-size="5.2" fill="#1c1a17">Exploded crown — the cinch is the joint</text>
<text x="14" y="274" font-family="Georgia, serif" font-size="3.2" fill="#5c5348">Angas 430 · Adib's tailgate oven · gas, circular dome · sheet 3 of 4</text>
<text x="14" y="282" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Dimensions mm. Scale as noted. Hardware CERN-OHL-P v2. This sheet CC-BY-4.0. 18 Oct 2026.</text>
<text x="300" y="266" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Do not scale the drawing.</text>
<text x="300" y="274" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Certified burner, FFD, regulator, hose: bought.</text>
<text x="300" y="282" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Crown lifts at the brass cinch. Stone does not pass the mouth.</text>

<rect x="175.0" y="40" width="70" height="14" rx="2" fill="#6b3e28" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="49" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Jarrah handles and brass ferrules, off to the side</text>
<rect x="135.0" y="58" width="150" height="14" rx="2" fill="#c4a46a" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="67" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Brass cinch band, 35 × 3, and two road dowels</text>
<rect x="120.0" y="78" width="180" height="14" rx="2" fill="#b7bcc1" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="87" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">304 crown, 1.2 skin, lifts off the joggle</text>
<rect x="110.0" y="100" width="200" height="14" rx="2" fill="#e6d7a8" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="109" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">75 mm AES crown blanket, lifts with the crown</text>
<rect x="100.0" y="124" width="220" height="14" rx="2" fill="#8d9398" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="133" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">304 liner dome, lifts with the crown</text>
<rect x="90.0" y="150" width="240" height="14" rx="2" fill="#efe6d6" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="159" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Skirt, wall insulation, floor, stone — stays put</text>
<rect x="80.0" y="178" width="260" height="14" rx="2" fill="#5c5348" stroke="#1c1a17" stroke-width="0.3"/>
<text x="24" y="187" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Base pan, stub feet or the 750 mm tripod</text>
<text x="24" y="214" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Order of the evening: legs or table, crown stays on, burner lights. Order of a clean: band off, crown off, stone out.</text>
<text x="24" y="222" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">On the road the two dowels and the band bolt keep the crown from walking. They are finger parts, not a tool kit.</text>
</svg>
