<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="420" height="297" fill="#f7f4ee"/>
<rect x="8" y="8" width="404" height="281" fill="none" stroke="#1c1a17" stroke-width="0.6"/>
<rect x="8" y="252" width="404" height="37" fill="none" stroke="#1c1a17" stroke-width="0.4"/>
<text x="14" y="266" font-family="Georgia, serif" font-size="5.2" fill="#1c1a17">Stowed in the BYD Shark 6 tub, between the wheel arches</text>
<text x="14" y="274" font-family="Georgia, serif" font-size="3.2" fill="#5c5348">Angas 430 · Adib's tailgate oven · gas, circular dome · sheet 4 of 4</text>
<text x="14" y="282" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Dimensions mm. Scale as noted. Hardware CERN-OHL-P v2. This sheet CC-BY-4.0. 18 Oct 2026.</text>
<text x="300" y="266" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Do not scale the drawing.</text>
<text x="300" y="274" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Certified burner, FFD, regulator, hose: bought.</text>
<text x="300" y="282" font-family="Georgia, serif" font-size="2.8" fill="#5c5348">Crown lifts at the brass cinch. Stone does not pass the mouth.</text>

<text x="14" y="22" font-family="Georgia, serif" font-size="3.2" fill="#1c1a17">Plan. Scale about 1:7.6. Cab is to the left. Tailgate to the right.</text>
<rect x="30" y="36" width="200.0" height="161.1" fill="#e7e2d8" stroke="#1c1a17" stroke-width="0.6"/>
<circle cx="77.4" cy="116.5" r="44.4" fill="#efe6d6" stroke="#1c1a17" stroke-width="0.5"/>
<text x="65.4" y="116.5" font-family="Georgia, serif" font-size="3" fill="#1c1a17">oven</text>
<rect x="129.8" y="67.2" width="3.2" height="98.7" fill="#8d9398" stroke="#1c1a17" stroke-width="0.2"/>
<rect x="135.8" y="67.2" width="3.2" height="98.7" fill="#8d9398" stroke="#1c1a17" stroke-width="0.2"/>
<rect x="141.8" y="67.2" width="3.2" height="98.7" fill="#8d9398" stroke="#1c1a17" stroke-width="0.2"/>
<text x="125.8" y="64.2" font-family="Georgia, serif" font-size="2.8" fill="#1c1a17">3 legs</text>
<text x="250" y="230" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Body 340 high, stub feet 65, stowed about 385. Tub is 517 deep.</text>
<text x="250" y="238" font-family="Georgia, serif" font-size="3.3" fill="#1c1a17">Tie to the factory points. Stone can ride in the oven; it is the heavy loose part.</text>
<text x="250" y="250" font-family="Georgia, serif" font-size="3.3" fill="#5c5348">The lowered tailgate is 517 deep. This plan is 625. Cook beside the ute, prep on the tailgate.</text>
</svg>
